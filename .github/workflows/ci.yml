name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  powershell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax (pwsh is preinstalled on this runner)
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "collectors/collect_windows.ps1", [ref]$null, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "collect_windows.ps1: no syntax errors"

  end-to-end-demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyze sample reports and render HTML (exit 2 on the sick host is expected)
        run: |
          python -m syspulse analyze tests/fixtures/healthy_host.json --db demo.db
          python -m syspulse analyze tests/fixtures/sick_host.json --db demo.db || true
          python -m syspulse show --db demo.db --hostname WKS-SICK-07 --out report.html
          grep -q "CRITICAL" report.html